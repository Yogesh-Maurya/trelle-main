apiVersion: v1
kind: Service
metadata:
  name: flask-app-service
  labels:
    app: flask-app
spec:
  selector:
    app: flask-app  # Matches the labels in the deployment
  ports:
  - protocol: TCP
    port: 80        # Port exposed by the service
    targetPort: 5000  # Port exposed by the container
  type: ClusterIP  # Use ClusterIP for internal access or LoadBalancer for external access